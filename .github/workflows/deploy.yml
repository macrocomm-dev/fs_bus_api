# ---------------------------------------------------------------------------
# CI/CD — FS Bus API
#
# Triggers on every push to main:
#   1. Runs tests
#   2. Builds Docker image and pushes to Artifact Registry
#   3. Deploys to Cloud Run
#
# Required GitHub Actions variables:
#   GCP_PROJECT_ID         — GCloud project ID (e.g. bus-track-480813)
#   GCP_REGION             — Cloud Run / Artifact Registry region (e.g. africa-south1)
#   CLOUD_SQL_INSTANCE     — Cloud SQL connection name (<project>:<region>:<instance>)
#   ARTIFACT_REGISTRY_REPO — Artifact Registry repository name
#   CLOUD_RUN_SERVICE      — Cloud Run service name
#   WIF_PROVIDER           — Workload Identity Provider resource name
#   WIF_SERVICE_ACCOUNT    — Service account email used by GitHub Actions
# ---------------------------------------------------------------------------

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  AUDIT_SUCCESS_PAYLOADS_ENABLED: ${{ vars.AUDIT_SUCCESS_PAYLOADS_ENABLED || 'true' }}
  IMAGE_NAME: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/fs-bus-api

jobs:
  # --------------------------------------------------------------------------
  # Test
  # --------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found — skipping."
          fi

  # --------------------------------------------------------------------------
  # Build & Push Docker image (only on push to main)
  # --------------------------------------------------------------------------
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  # --------------------------------------------------------------------------
  # Deploy to Cloud Run
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --service-account "fs-bus-api-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets="SECRET_KEY=api-secret-key:latest,DB_PASSWORD=db-password:latest,DB_NAME=db-name:latest,DB_USER=db-user:latest,SMART_FLEET_EMAIL=smart-fleet-email:latest,SMART_FLEET_API_HASH=smart-fleet-api-hash:latest" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_INSTANCE }},SMART_FLEET_BASE_URL=https://smart-fleet.co.za,AUDIT_SUCCESS_PAYLOADS_ENABLED=${{ env.AUDIT_SUCCESS_PAYLOADS_ENABLED }}" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --format "value(status.url)"
